[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: offline framework tests
    ui: browser tests
    smoke: smoke tests
    example: live site examples, not run in default CI
    intercept: tests that capture XHR/fetch
# Default CI runs tests/unit only. Live examples: pytest tests/examples -m example
